[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-mcp"
version = "1.2.1"
description = "Universal, update-proof Model Context Protocol bridge for Roblox Studio on Windows and macOS."
readme = "README.md"
authors = [{ name = "Cory Pleasance" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["roblox", "roblox-studio", "mcp", "model-context-protocol", "claude", "cursor", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Games/Entertainment",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
roblox-studio-mcp = "roblox_studio_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Cpleasance/roblox-studio-mcp-bridge"
Documentation = "https://github.com/Cpleasance/roblox-studio-mcp-bridge#readme"
Repository = "https://github.com/Cpleasance/roblox-studio-mcp-bridge.git"
"Bug Tracker" = "https://github.com/Cpleasance/roblox-studio-mcp-bridge/issues"
Changelog = "https://github.com/Cpleasance/roblox-studio-mcp-bridge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["roblox_studio_mcp*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test assertions use intentionally long literal dicts/lambdas.
"tests/*" = ["E501"]
